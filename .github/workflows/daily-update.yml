name: Atualização diária

on:
  schedule:
    - cron: "17 8 * * *"   # todo dia às 05:17 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar SDK do Claude
        run: pip install --upgrade anthropic

      - name: Atualizar vídeos (canais + sequência das aulas)
        run: python scripts/update_videos.py
        continue-on-error: true

      - name: Gerar aula do dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_daily.py

      - name: Salvar mudanças
        run: |
          git config user.name "english-journey-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nada novo hoje."
          else
            git commit -m "Atualização diária $(date -u +%Y-%m-%d)"
            git push
          fi
